<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Case Converter - Free Online Text Case Tool</title>
<meta name="description" content="Free online case converter tool. Convert text to UPPERCASE, lowercase, Title Case instantly. No signup required." />

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0b1220;
    color: white;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 38px;
    margin: 0;
  }

  p {
    color: #9ca3af;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 200px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    background: #111827;
    color: white;
    font-size: 16px;
    outline: none;
  }

  textarea:focus {
    border-color: #60a5fa;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
  }

  button {
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #374151;
  }

  .output {
    margin-top: 20px;
    background: #111827;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    min-height: 60px;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<header>
  <h1>Case Converter</h1>
  <p>Convert text to UPPERCASE, lowercase, or Title Case instantly</p>
</header>

<div class="container">

  <textarea id="input" placeholder="Paste or type your text here..."></textarea>

  <div class="buttons">
    <button onclick="toUpper()">UPPERCASE</button>
    <button onclick="toLower()">lowercase</button>
    <button onclick="toTitle()">Title Case</button>
    <button onclick="clearText()">Clear</button>
  </div>

  <div class="output" id="output">Your converted text will appear here...</div>

</div>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");

function toUpper() {
  output.innerText = input.value.toUpperCase();
}

function toLower() {
  output.innerText = input.value.toLowerCase();
}

function toTitle() {
  output.innerText = input.value
    .toLowerCase()
    .replace(/\b\w/g, c => c.toUpperCase());
}

function clearText() {
  input.value = "";
  output.innerText = "Your converted text will appear here...";
}
</script>

</body>
</html>
