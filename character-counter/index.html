<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Character Counter - Free Online Tool</title>
<meta name="description" content="Free character counter tool. Count characters, words, and sentences instantly." />

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0b1220;
    color: white;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 36px;
    margin: 0;
  }

  p {
    color: #9ca3af;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 220px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    background: #111827;
    color: white;
    font-size: 16px;
    outline: none;
  }

  textarea:focus {
    border-color: #60a5fa;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  .number {
    font-size: 28px;
    font-weight: bold;
  }

  .label {
    color: #9ca3af;
    margin-top: 5px;
  }
</style>
</head>

<body>

<header>
  <h1>Character Counter</h1>
  <p>Instantly count characters, words, and sentences</p>
</header>

<div class="container">

  <textarea id="text" placeholder="Type or paste text here..."></textarea>

  <div class="stats">
    <div class="card">
      <div class="number" id="chars">0</div>
      <div class="label">Characters</div>
    </div>

    <div class="card">
      <div class="number" id="words">0</div>
      <div class="label">Words</div>
    </div>

    <div class="card">
      <div class="number" id="sentences">0</div>
      <div class="label">Sentences</div>
    </div>
  </div>

</div>

<script>
const textArea = document.getElementById("text");

function updateStats() {
  const text = textArea.value;

  const chars = text.length;

  const words = text.trim()
    ? text.trim().split(/\s+/).length
    : 0;

  const sentences = text.trim()
    ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length
    : 0;

  document.getElementById("chars").innerText = chars;
  document.getElementById("words").innerText = words;
  document.getElementById("sentences").innerText = sentences;
}

textArea.addEventListener("input", updateStats);
</script>

</body>
</html>
