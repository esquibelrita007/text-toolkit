<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>JSON Formatter - Free Online Tool</title>
<meta name="description" content="Format, validate, and beautify JSON instantly with this free online JSON formatter tool."/>

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0b1220;
    color: white;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    margin: 0;
    font-size: 36px;
  }

  p {
    color: #9ca3af;
  }

  .container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 220px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    background: #111827;
    color: white;
    font-family: monospace;
    font-size: 14px;
    outline: none;
  }

  textarea:focus {
    border-color: #60a5fa;
  }

  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
  }

  button {
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #374151;
  }

  .output {
    margin-top: 20px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 16px;
    white-space: pre-wrap;
    font-family: monospace;
    min-height: 120px;
  }

  .msg {
    margin-top: 10px;
    font-size: 14px;
  }

  .error {
    color: #f87171;
  }

  .success {
    color: #4ade80;
  }
</style>
</head>

<body>

<header>
  <h1>JSON Formatter</h1>
  <p>Validate, format, and beautify JSON instantly</p>
</header>

<div class="container">

  <textarea id="input" placeholder='Paste your JSON here...'></textarea>

  <div class="buttons">
    <button onclick="formatJSON()">Format</button>
    <button onclick="minifyJSON()">Minify</button>
    <button onclick="clearAll()">Clear</button>
  </div>

  <div id="message" class="msg"></div>

  <div class="output" id="output">Output will appear here...</div>

</div>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const message = document.getElementById("message");

function formatJSON() {
  try {
    const parsed = JSON.parse(input.value);
    output.textContent = JSON.stringify(parsed, null, 2);
    showMsg("Valid JSON formatted successfully ✔", true);
  } catch (e) {
    showMsg("Invalid JSON ❌ Please check syntax", false);
  }
}

function minifyJSON() {
  try {
    const parsed = JSON.parse(input.value);
    output.textContent = JSON.stringify(parsed);
    showMsg("JSON minified ✔", true);
  } catch (e) {
    showMsg("Invalid JSON ❌ cannot minify", false);
  }
}

function clearAll() {
  input.value = "";
  output.textContent = "Output will appear here...";
  message.textContent = "";
}

function showMsg(text, success) {
  message.textContent = text;
  message.className = success ? "msg success" : "msg error";
}
</script>

</body>
</html>
