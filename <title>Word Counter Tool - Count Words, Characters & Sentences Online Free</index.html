<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Count words, characters, and sentences instantly. Free online word counter tool." />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Word Counter - Free Online Tool</title>
<meta name="description" content="Count words, characters, and sentences instantly. Free online word counter tool." />

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0b1220;
    color: white;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    margin: 0;
    font-size: 38px;
  }

  p {
    color: #a1a1aa;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 220px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #2a3441;
    background: #111827;
    color: white;
    font-size: 16px;
    outline: none;
  }

  textarea:focus {
    border-color: #60a5fa;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .card {
    background: #111827;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #1f2937;
  }

  .number {
    font-size: 28px;
    font-weight: bold;
  }

  .label {
    color: #9ca3af;
    margin-top: 5px;
  }
</style>
</head>

<body>

<header>
  <h1>Word Counter</h1>
  <p>Instantly count words, characters, and sentences</p>
</header>

<div class="container">

  <textarea id="text" placeholder="Start typing or paste your text..."></textarea>

  <div class="stats">
    <div class="card">
      <div class="number" id="words">0</div>
      <div class="label">Words</div>
    </div>

    <div class="card">
      <div class="number" id="chars">0</div>
      <div class="label">Characters</div>
    </div>

    <div class="card">
      <div class="number" id="sentences">0</div>
      <div class="label">Sentences</div>
    </div>
  </div>

</div>

<script>
const textArea = document.getElementById("text");

textArea.addEventListener("input", () => {
  const text = textArea.value.trim();

  const words = text ? text.split(/\s+/).length : 0;
  const chars = text.length;
  const sentences = text ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;

  document.getElementById("words").innerText = words;
  document.getElementById("chars").innerText = chars;
  document.getElementById("sentences").innerText = sentences;
});
</script>

</body>
</html>
