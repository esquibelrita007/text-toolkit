<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Slug Generator - Free SEO URL Slug Tool</title>

<meta name="description" content="Convert text into clean SEO-friendly URL slugs instantly with this free online slug generator tool." />

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0b1220;
    color: white;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 38px;
    margin: 0;
  }

  p {
    color: #94a3b8;
  }

  .container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 160px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    background: #111827;
    color: white;
    font-size: 16px;
    outline: none;
    resize: vertical;
  }

  textarea:focus {
    border-color: #3b82f6;
  }

  .output {
    margin-top: 20px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    word-break: break-word;
  }

  button {
    margin-top: 15px;
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #374151;
  }

  .small {
    margin-top: 10px;
    color: #94a3b8;
    font-size: 14px;
  }
</style>
</head>

<body>

<header>
  <h1>Slug Generator</h1>
  <p>Create SEO-friendly URL slugs instantly</p>
</header>

<div class="container">

  <textarea id="input" placeholder="Enter your text here..."></textarea>

  <button onclick="generateSlug()">Generate Slug</button>

  <div class="output" id="output">
    your-slug-will-appear-here
  </div>

  <button onclick="copySlug()">Copy Slug</button>

  <div class="small" id="message"></div>

</div>

<script>
function generateSlug() {
  const text = document.getElementById("input").value;

  const slug = text
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/--+/g, "-");

  document.getElementById("output").textContent =
    slug || "your-slug-will-appear-here";

  document.getElementById("message").textContent =
    "Slug generated successfully ✔";
}

function copySlug() {
  const slug = document.getElementById("output").textContent;

  navigator.clipboard.writeText(slug);

  document.getElementById("message").textContent =
    "Slug copied to clipboard ✔";
}
</script>

</body>
</html>
